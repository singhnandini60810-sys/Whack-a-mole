<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Whack A Mole</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="menu">

<h1>🐹 Whack-A-Mole</h1>

<h2>Select Difficulty</h2>


<button onclick="selectLevel('easy')">
Easy 🐢
</button>


<button onclick="selectLevel('medium')">
Medium ⚡
</button>


<button onclick="selectLevel('hard')">
Hard 🔥
</button>


</div>



<div id="game" style="display:none">


<h1>🐹 Whack-A-Mole</h1>


<div class="stats">


<div>
Score
<h2 id="score">0</h2>
</div>


<div>
Miss
<h2 id="miss">0</h2>
</div>


<div>
High
<h2 id="high">0</h2>
</div>


</div>




<div id="board"></div>



<div>

<button onclick="pauseGame()">
Pause
</button>


<button onclick="restartGame()">
Restart
</button>

</div>


</div>



<div id="hammer">
🔨
</div>



<script src="./script.js"></script>

</body>

</html>
